# rabbitmq.conf – Configuración principal de RabbitMQ
# Carga las definiciones precargadas (exchanges, queues, bindings)
management.load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console = true
log.console.level = info

# Heartbeat para detectar conexiones caídas
heartbeat = 60

# Límite de mensajes en memoria antes de persistir a disco
vm_memory_high_watermark.relative = 0.6

# Prometheus metrics plugin
prometheus.return_per_object_metrics = true
