apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  
  - name: PostgreSQL
    type: postgres
    uid: postgres_weather
    url: postgres:5432
    user: weather_user
    secureJsonData:
      password: weather_pass
    database: weather_db
    jsonData:
      sslmode: 'disable'
      postgresVersion: 16
